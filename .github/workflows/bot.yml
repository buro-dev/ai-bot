name: Telegram AI Bot

# Bot iki şekilde tetiklenebilir:
#   1) "Run workflow" ile elle (workflow_dispatch)
#   2) Zamanlanmış görev ile (schedule) - GitHub'ın cron zamanlaması UTC'dir ve
#      yoğunlukta birkaç dakika gecikebilir.
#
# Varsayılan mod "loop": bot LOOP_MINUTES (4.5 dk) boyunca uzun-polling ile mesaj
# bekler, böylece yanıtlar cron aralığını beklemeden anında gönderilir. Süre bitince
# iş biter, bir sonraki zamanlanmış çalıştırma sıraya girer ve dinleme döngüsü sürer.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Çalışma modu (loop = süre boyunca mesaj bekle - önerilen, once = tek tur)"
        required: false
        default: "loop"
        type: choice
        options:
          - loop
          - once
  schedule:
    # Her 5 dakikada bir (UTC). Bot her çalıştırmada 4.5 dk mesaj dinlediği için
    # pratikte kesintisiz bir dinleme döngüsü oluşur.
    - cron: "*/5 * * * *"

# Bot, chat_history.json dosyasını repoya geri push'ladığı için yazma izni gerekir.
permissions:
  contents: write

# Aynı anda tek bot örneği çalışsın (getUpdates çakışmasını önler).
concurrency:
  group: telegram-ai-bot
  cancel-in-progress: false

jobs:
  run-bot:
    name: Botu çalıştır
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # --- Zorunlu GitHub Secrets ---
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      ALLOWED_USER_ID: ${{ secrets.ALLOWED_USER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
      # --- Diğer ayarlar ---
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONUNBUFFERED: "1"
      # loop modunda her çalıştırmada mesaj dinlenecek süre (dakika).
      # cron aralığından (5 dk) kısa tutulur ki çalıştırmalar üst üste binmesin.
      LOOP_MINUTES: "4.5"
      # Yerleşik GITHUB_TOKEN yerine PAT ile push etmek için (PAT yoksa boş kalır,
      # o durumda checkout'tan gelen kimlik bilgisi kullanılır).
      GIT_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4
        with:
          # Sohbet geçmişini commit'leyip geri push edebilmek için:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.10 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Git kimliğini ayarla
        run: |
          git config user.name "telegram-ai-bot"
          git config user.email "telegram-ai-bot@users.noreply.github.com"

      - name: Gizli anahtarları kontrol et
        run: |
          eksik=0
          for ad in TELEGRAM_TOKEN ALLOWED_USER_ID GROQ_API_KEY; do
            if [ -z "${!ad}" ]; then
              echo "::error::$ad secret tanımlı değil. Settings > Secrets and variables > Actions bölümünden ekleyin."
              eksik=1
            fi
          done
          if [ -z "${GH_PAT_TOKEN}" ]; then
            echo "::warning::GH_PAT_TOKEN tanımlı değil; sohbet geçmişi repoya push edilemeyebilir."
          fi
          exit $eksik

      - name: Sözdizimi ve kendi kendini test (bot.py)
        run: |
          python -m py_compile bot.py
          python bot.py --self-test

      - name: Botu çalıştır
        env:
          # Elle çalıştırmada seçilen mod; zamanlanmış çalıştırmada "loop".
          BOT_MODE: ${{ github.event.inputs.mode || 'loop' }}
        run: python bot.py --mode "${BOT_MODE:-loop}"
