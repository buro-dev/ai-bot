name: Telegram AI Bot

# Bot, 6 saatte bir kendini yenileyen KESİNTİSİZ bir döngüde çalışır:
#   1) Her çalıştırma 5.5 saat (--mode loop --loop-minutes 330) boyunca
#      uzun-polling ile mesaj dinler; job timeout'u 350 dakikadır.
#   2) Job'un SON ADIMI akışı kendini yeniden tetikler:
#      "gh workflow run bot.yml -f mode=loop -f loop_minutes=330"
#      (if: always() -> bot adımı hata verse bile döngü devam eder).
#   3) cron "0 */6 * * *" GÜVENLİK AĞIDIR: kendinden-tetikleme zinciri bozulursa
#      (yetki/API sorunu, silinen run, vb.) 6 saatlik sınırda GitHub kendiliğinden
#      yeni bir çalıştırma başlatır.
#
# concurrency grubu (telegram-ai-bot, cancel-in-progress: false) sayesinde aynı
# anda TEK örnek çalışır; üst üste düşen çalıştırmalar kuyruğa girer, iptal
# edilmez. Böylece getUpdates çakışması olmaz ve dinleme kesintiye uğramaz.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Çalışma modu (loop = süre boyunca mesaj bekle - önerilen, once = tek tur)"
        required: false
        default: "loop"
        type: choice
        options:
          - loop
          - once
      loop_minutes:
        description: "loop modunda mesaj dinleme süresi (dk)"
        required: false
        default: "330"
        type: string
  schedule:
    # Güvenlik ağı: 6 saatte bir (UTC). Normalde kendinden-tetikleme zinciri
    # kesintisiz çalışır; cron yalnızca zincir bozulduğunda devreye girer.
    - cron: "0 */6 * * *"

# Bot, chat_history.json dosyasını repoya geri push'lar (contents: write) ve
# kendini yeniden tetikler (actions: write -> gh workflow run).
permissions:
  contents: write
  actions: write

# Aynı anda tek bot örneği çalışsın (getUpdates çakışmasını önler).
concurrency:
  group: telegram-ai-bot
  cancel-in-progress: false

jobs:
  run-bot:
    name: Botu çalıştır (5.5 saat dinleme + kendini yeniden tetikle)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # --- Zorunlu GitHub Secrets ---
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      ALLOWED_USER_ID: ${{ secrets.ALLOWED_USER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
      # --- Diğer ayarlar ---
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONUNBUFFERED: "1"
      # loop modunda mesaj dinlenecek süre (dk): 5.5 saat. 6 saatlik döngüden
      # kısadır ki çalıştırma, kendini yeniden tetikleyene kadar bitsin.
      LOOP_MINUTES: "330"
      # Her yanıtlandıktan sonra geçmişi repoya otomatik commit+push et
      # (iki push arası en kısa süre GIT_PUSH_MIN_INTERVAL saniye). Böylece
      # uzun oturum yarıda kesilse bile chat_history.json repoda güncel kalır.
      GIT_PUSH_AFTER_EACH_MESSAGE: "1"
      GIT_PUSH_MIN_INTERVAL: "15"
      # Uzun oturumlarda heartbeat log aralığı (sn).
      HEARTBEAT_SECONDS: "60"
      # Yerleşik GITHUB_TOKEN yerine PAT ile push etmek için (PAT yoksa boş
      # kalır, o durumda checkout'tan gelen kimlik bilgisi kullanılır).
      GIT_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4
        with:
          # Sohbet geçmişini commit'leyip geri push edebilmek için:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.10 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Git kimliğini ayarla
        run: |
          git config user.name "telegram-ai-bot"
          git config user.email "telegram-ai-bot@users.noreply.github.com"

      - name: Gizli anahtarları kontrol et
        run: |
          eksik=0
          for ad in TELEGRAM_TOKEN ALLOWED_USER_ID GROQ_API_KEY; do
            if [ -z "${!ad}" ]; then
              echo "::error::$ad secret tanımlı değil. Settings > Secrets and variables > Actions bölümünden ekleyin."
              eksik=1
            fi
          done
          if [ -z "${GH_PAT_TOKEN}" ]; then
            echo "::warning::GH_PAT_TOKEN tanımlı değil; sohbet geçmişi repoya push edilemeyebilir."
          fi
          exit $eksik

      - name: Sözdizimi ve kendi kendini test (bot.py)
        run: |
          python -m py_compile bot.py
          python bot.py --self-test

      - name: Botu çalıştır (5.5 saat dinleme)
        env:
          # Elle çalıştırmada seçilen mod; zamanlanmış/kendinden-tetiklemelerde "loop".
          BOT_MODE: ${{ github.event.inputs.mode || 'loop' }}
          BOT_LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '330' }}
        run: python bot.py --mode "${BOT_MODE:-loop}" --loop-minutes "${BOT_LOOP_MINUTES:-330}"

      - name: Döngüyü sürdür (kendini yeniden tetikle)
        # if: always() -> bot adımı başarısız da olsa döngü kırılmasın.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Yeni çalıştırma tetikleniyor: mode=loop, loop_minutes=330"
          gh workflow run bot.yml -f mode=loop -f loop_minutes=330
