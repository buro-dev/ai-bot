# =============================================================================
# YEDEK HOSTING: GitHub Actions (yeni hesap gerektirmez)
#
# Etkinleştirme:
#   Bu dosyayı .github/workflows/bot.yml olarak kopyala.
#   ÖNEMLİ: Bu modu kullanıyorsan Oracle/Render'da aynı botu ÇALIŞTIRMA
#   (aynı token ile iki örnek = "Conflict" hatası).
#
# Depo PUBLIC olduğu için Actions dakika limitleri bedava ve sınırsızdır.
# Bot ~5.5 saat boyunca mesaj dinler, job biter bitmez kendini yeniden
# tetikler; 6 saatlik cron güvenlik ağıdır. Geçici Actions disk'i için
# hafıza "memory" git dalına push edilir (kod zaten bunu yapıyor).
#
# Gerekli GitHub Secrets (Settings > Secrets and variables > Actions):
#   TELEGRAM_TOKEN, ALLOWED_USER_ID, GROQ_API_KEY, GH_PAT_TOKEN
# =============================================================================
name: Telegram AI Bot (yedek)

on:
  workflow_dispatch: {}
  schedule:
    # Güvenlik ağı: zincir bozulursa 6 saatte bir GitHub yeniden başlatır.
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

# Aynı anda TEK örnek (getUpdates çakışmasını önler).
concurrency:
  group: telegram-ai-bot
  cancel-in-progress: false

jobs:
  run-bot:
    name: Botu çalıştır (~5.5 saat dinleme + kendini yeniden tetikle)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      ALLOWED_USER_ID: ${{ secrets.ALLOWED_USER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONUNBUFFERED: "1"
      RUN_MODE: poll
      GIT_PUSH_MIN_INTERVAL: "15"
      HEARTBEAT: "1"

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları yükle
        run: python -m pip install -r requirements.txt

      - name: Git kimliğini ayarla
        run: |
          git config user.name "telegram-ai-bot"
          git config user.email "telegram-ai-bot@users.noreply.github.com"

      - name: Gizli anahtarları kontrol et
        run: |
          eksik=0
          for ad in TELEGRAM_TOKEN ALLOWED_USER_ID GROQ_API_KEY; do
            if [ -z "${!ad}" ]; then
              echo "::error::$ad secret tanımlı değil (Settings > Secrets and variables > Actions)."
              eksik=1
            fi
          done
          exit $eksik

      - name: İç testler
        run: python main.py --self-test

      - name: Botu çalıştır (poll modunda, job timeout'una kadar)
        run: python main.py

      - name: Döngüyü sürdür (kendini yeniden tetikle)
        # if: always() -> bot adımı hata verse bile döngü kırılmasın.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh workflow run bot.yml
